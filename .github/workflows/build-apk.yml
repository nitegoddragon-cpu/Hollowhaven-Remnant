name: Build Hollowhaven Remnant 2.6.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract existing V7.4 sprite project
        run: |
          unzip -q Hollowhaven_Remnant_ANDROID_V7_4_SPRITE_FIX_READY_FIXED.zip -d build-project
          cp -a build-project/v74project/. .
          rm -rf build-project
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Extract 2.6.0 overlay from uploaded package
        run: |
          unzip -q Hollowhaven_2.6.0_GitHub_Upload_Package.zip -d package-2.6.0
          test -f package-2.6.0/build-path/2.6.0/overlay/app/build.gradle
          test -f package-2.6.0/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/AiVideoWorkerClient.java

      - name: Overlay Hollowhaven 2.6.0 source
        run: |
          cp -f package-2.6.0/build-path/2.6.0/overlay/app/build.gradle app/build.gradle
          cp -f package-2.6.0/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/AiVideoWorkerClient.java app/src/main/java/com/hollowhaven/remnant/AiVideoWorkerClient.java
          cp -f package-2.6.0/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/MainActivity.java app/src/main/java/com/hollowhaven/remnant/MainActivity.java
          cp -f package-2.6.0/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java
          cp -f package-2.6.0/build-path/2.6.0/overlay/app/src/main/assets/hollowhaven/index.html app/src/main/assets/hollowhaven/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install QA dependency
        run: python3 -m pip install --user Pillow

      - name: Run Hollowhaven QA
        run: python3 tools/qa_project.py

      - name: Fix Locale reference
        run: |
          sed -i 's/Locale\.ROOT/java.util.Locale.ROOT/g' app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java

      - name: Lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify debug APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK and AAB
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hollowhaven-Remnant-2.6.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Hollowhaven-Remnant-2.6.0-release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Hollowhaven-Remnant-2.6.0-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
