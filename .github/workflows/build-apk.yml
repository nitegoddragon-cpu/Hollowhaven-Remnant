name: Build Hollowhaven Remnant 2.6.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required project files
        run: |
          test -f Hollowhaven_Remnant_ANDROID_V7_4_SPRITE_FIX_READY_FIXED.zip
          test -f Hollowhaven_2.6.0_GitHub_Upload_Package.zip

      - name: Extract existing V7.4 sprite project
        run: |
          unzip -q Hollowhaven_Remnant_ANDROID_V7_4_SPRITE_FIX_READY_FIXED.zip -d build-project
          cp -a build-project/v74project/. .
          rm -rf build-project

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Extract Hollowhaven 2.6.0 source package
        run: |
          rm -rf hollowhaven-2.6-source
          mkdir -p hollowhaven-2.6-source

          unzip -q Hollowhaven_2.6.0_GitHub_Upload_Package.zip \
            -d hollowhaven-2.6-source

          test -f hollowhaven-2.6-source/build-path/2.6.0/overlay/app/build.gradle
          test -f hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/AiVideoWorkerClient.java
          test -f hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/MainActivity.java
          test -f hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java
          test -f hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/assets/hollowhaven/index.html

      - name: Overlay Hollowhaven 2.6.0 source
        run: |
          cp -f \
            hollowhaven-2.6-source/build-path/2.6.0/overlay/app/build.gradle \
            app/build.gradle

          cp -f \
            hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/AiVideoWorkerClient.java \
            app/src/main/java/com/hollowhaven/remnant/AiVideoWorkerClient.java

          cp -f \
            hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/MainActivity.java \
            app/src/main/java/com/hollowhaven/remnant/MainActivity.java

          cp -f \
            hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java \
            app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java

          cp -f \
            hollowhaven-2.6-source/build-path/2.6.0/overlay/app/src/main/assets/hollowhaven/index.html \
            app/src/main/assets/hollowhaven/index.html

          rm -rf hollowhaven-2.6-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install QA dependency
        run: |
          python3 -m pip install --user Pillow

      - name: Run Hollowhaven QA
        run: |
          python3 tools/qa_project.py

      - name: Fix Locale reference
        run: |
          sed -i \
            's/Locale\.ROOT/java.util.Locale.ROOT/g' \
            app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java

      - name: Lint
        run: |
          gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace
