<script>
var SW=107,SH=150,state='fall',dir=1,wall=1,vx=0,vy=0,goal=null;
function rnd(a,b){return a+Math.random()*(b-a);}
var tex=document.getElementById('tex'),cv=document.getElementById('cv'),cx=cv.getContext('2d');
var P=24,DPR=Math.min(window.devicePixelRatio||1,2),GX=12,GY=18;

var pose={bob:0,tilt:0,sy:1,hd:0,f:0,b:0,fl:0,bl:0,tail:0,br:0,eye:0};
var T=0,ph=0,prev='fall',landT=0,roarT=0,blinkT=2,blinkN=0;
function sm(a,b,v){var t=(v-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}

      wH=sm(.40,.32,ny)*sm(.28,.42,nx),
      wF=sm(.60,.76,ny)*sm(.66,.58,nx)*sm(.10,.20,nx),
      wB=sm(.60,.76,ny)*sm(.62,.72,nx),
      wL=sm(.64,.78,ny)*sm(.20,.10,nx);

}
function draw(){
  var tw=tex.naturalWidth,th=tex.naturalHeight;if(!tw)return;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,SW+2*P,SH+2*P);
  var V=[],i,j;
  for(j=0;j<=GY;j++)for(i=0;i<=GX;i++)V.push(warp(i/GX,j/GY));
  for(j=0;j<GY;j++)for(i=0;i<GX;i++){
    var a=j*(GX+1)+i,b=a+1,c=a+GX+1,d=c+1;
    var sa=[i/GX*tw,j/GY*th],sb=[(i+1)/GX*tw,j/GY*th],sc=[i/GX*tw,(j+1)/GY*th],sd=[(i+1)/GX*tw,(j+1)/GY*th];
    tri([sa[0],sa[1],sb[0],sb[1],sc[0],sc[1]],[V[a][0],V[a][1],V[b][0],V[b][1],V[c][0],V[c][1]]);
    tri([sb[0],sb[1],sd[0],sd[1],sc[0],sc[1]],[V[b][0],V[b][1],V[d][0],V[d][1],V[c][0],V[c][1]]);
  }
  if(pose.eye>.05){
    [[.776,.082,3.8],[.862,.054,3],].forEach(function(o){
      var p=warp(o[0],o[1]);cx.save();cx.globalAlpha=Math.min(1,pose.eye);
      cx.fillStyle='#b8935a';cx.beginPath();cx.ellipse(p[0],p[1],o[2],o[2]*.62,0,0,7);cx.fill();
      cx.strokeStyle='rgba(50,35,15,.8)';cx.lineWidth=.9;cx.beginPath();cx.moveTo(p[0]-o[2]*.8,p[1]);cx.quadraticCurveTo(p[0],p[1]+1.6,p[0]+o[2]*.8,p[1]);cx.stroke();cx.restore();
    });
  }
}
function animate(dt){
  T+=dt;
  if(prev==='fall'&&state!=='fall'&&state!=='drag')landT=1;
  prev=state;landT=Math.max(0,landT-dt*3);roarT=Math.max(0,roarT-dt);
  var g={bob:0,tilt:0,sy:1,hd:0,f:0,b:0,fl:0,bl:0,tail:Math.sin(T*1.3)*.07,br:Math.sin(T*2)*.012,eye:0},s,c;
  if(state==='walk'){
    ph+=dt*(goal!==null?9:6);s=Math.sin(ph);c=Math.cos(ph);
    g.f=s*.22;g.b=-s*.22;g.fl=Math.max(0,c)*SH*.035;g.bl=Math.max(0,-c)*SH*.035;
    g.bob=-Math.abs(s)*3;g.hd=Math.sin(ph*2+.6)*.05;g.tail=s*.12;g.tilt=s*.02;
  }else if(state==='sit'){g.sy=.84;g.hd=-.06;g.tilt=-.03;g.br=Math.sin(T*1.6)*.02;}
  else if(state==='sleep'){g.sy=.78;g.hd=.42;g.eye=1;g.br=Math.sin(T*1.1)*.025;g.tail=0;}
  else if(state==='fall'){g.sy=1.07;g.f=.35;g.b=.3;g.fl=SH*.05;g.bl=SH*.05;g.hd=-.12;g.tilt=vx*.0002;}
  else if(state==='drag'){g.sy=1.07;g.f=Math.sin(T*3)*.3;g.b=-Math.sin(T*3)*.3;g.fl=SH*.03;g.bl=SH*.03;g.hd=-.15+Math.sin(T*5)*.05;g.tilt=Math.sin(T*2.4)*.05;}
  else if(state==='climb'){
    ph+=dt*8;s=Math.sin(ph);c=Math.cos(ph);
    g.f=s*.3;g.b=-s*.3;g.fl=Math.max(0,c)*SH*.04;g.bl=Math.max(0,-c)*SH*.04;g.hd=-.12;g.bob=-Math.abs(s)*2;
  }else{g.hd=Math.sin(T*.7)*.04;}
  if(landT>0)g.sy-=landT*.16;
  if(roarT>0){g.hd=-.3+Math.sin(roarT*45)*.015;g.sy=1.04;g.bob=-3;g.br=.03;}
  blinkT-=dt;if(blinkT<0){blinkN=.16;blinkT=rnd(2.5,5);}
  if(blinkN>0){blinkN-=dt;g.eye=Math.max(g.eye,1);}
  for(var k in g)pose[k]+=(g[k]-pose[k])*Math.min(1,dt*(k==='eye'?30:11));
  draw();
}

var FILT={ember:'hue-rotate(-30deg) saturate(1.5)',frost:'hue-rotate(150deg) saturate(.9) brightness(1.08)',void:'hue-rotate(250deg) saturate(1.3) brightness(.9)',blossom:'hue-rotate(-62deg) saturate(1.2) brightness(1.08)',stone:'grayscale(.95) contrast(1.1)'};
window.setPose=function(s,d,w,x,y){state=s;dir=d;wall=w;vx=x;vy=y;};
window.roar=function(){roarT=.8;};
window.setLook=function(l){document.getElementById('cv').style.filter=FILT[l]||'none';};
var last=performance.now(),box=document.getElementById('w');
function loop(n){var dt=Math.min((n-last)/1000,.05);last=n;animate(dt);
  box.style.transform=state==='climb'?'rotate('+(wall*12)+'deg) scaleX('+wall+')':'scaleX('+dir+')';
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
