
name: Build Hollowhaven Remnant V7.5 Pet Library

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract V7.4 project
        run: |
          unzip -q Hollowhaven_Remnant_ANDROID_V7_4_SPRITE_FIX_READY_FIXED.zip -d build-project
          cp -a build-project/v74project/. .
          rm -rf build-project
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Stage Forest Spirit built-in pack
        run: |
          mkdir -p /tmp/forest_spirit
          base64 -d .github/assets/forest_spirit_q40.zip.b64 > /tmp/forest_spirit.zip
          unzip -q /tmp/forest_spirit.zip -d /tmp/forest_spirit
          mkdir -p app/src/main/assets/hollowhaven/pets
          cp -a /tmp/forest_spirit/pets/forest_spirit app/src/main/assets/hollowhaven/pets/forest_spirit
          test "$(find app/src/main/assets/hollowhaven/pets/forest_spirit/idle -type f | wc -l)" -eq 57

      - name: Apply Pet Library patch
        run: |
          python3 tools/apply_pet_library_v1_forest.py \
            app/src/main/java/com/hollowhaven/remnant/MainActivity.java \
            app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install QA dependency
        run: python3 -m pip install --user Pillow

      - name: Run project QA
        run: python3 tools/qa_project.py

      - name: Run Pet Library QA
        run: python3 tools/qa_pet_library.py

      - name: Fix Locale reference
        run: |
          sed -i 's/Locale\.ROOT/java.util.Locale.ROOT/g' \
            "app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java"
          grep -n "java.util.Locale.ROOT" \
            "app/src/main/java/com/hollowhaven/remnant/RemnantOverlayService.java"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify debug APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK and AAB
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleRelease :app:bundleRelease

      - name: Verify release outputs
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hollowhaven-Remnant-V7.5-PetLibrary-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Hollowhaven-Remnant-V7.5-PetLibrary-release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Hollowhaven-Remnant-V7.5-PetLibrary-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
